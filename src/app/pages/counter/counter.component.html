<main class="counter">
  <div class="timer">
    <!-- ====================================================== -->
    <!-- CIRCULAR PROGRESS -->
    <!-- ====================================================== -->

    <svg class="progress-ring" viewBox="0 0 1000 1000" aria-hidden="true">
      <!-- Background ring -->

      <circle
        class="progress-track"
        cx="500"
        cy="500"
        r="470"
        pathLength="100"
      ></circle>

      <!-- Countdown ring -->

      <circle
        class="progress-value"
        cx="500"
        cy="500"
        r="470"
        pathLength="100"
        [attr.stroke-dasharray]="progressPercent + ' 100'"
      ></circle>
    </svg>

    <!-- ====================================================== -->
    <!-- TIMER CONTENT -->
    <!-- ====================================================== -->

    <div class="timer-content">
      <div class="time">
        <!-- MINUTES -->

        <div class="time-unit">
          <span class="number">
            {{ minutes }}
          </span>

          <span class="label"> MINUTES </span>
        </div>

        <!-- COLON -->

        <span class="colon"> : </span>

        <!-- SECONDS -->

        <div class="time-unit">
          <span class="number">
            {{ seconds }}
          </span>

          <span class="label"> SECONDS </span>
        </div>
      </div>
    </div>
  </div>
</main>
